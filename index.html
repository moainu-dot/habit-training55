<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="運動習慣">
<link rel="manifest" href="manifest.webmanifest">
<title>運動習慣</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--line:#2a3038;--text:#f7f8fa;--muted:#98a2b3;--blue:#7dd3fc;--green:#86efac}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{min-height:100vh}.app{max-width:720px;margin:auto;padding:18px 14px 100px}
h1{font-size:26px;margin:4px 0}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.quick button{border:0;border-radius:22px;padding:22px 10px;min-height:112px;font-size:18px;font-weight:800;cursor:pointer}
#strengthBtn{background:linear-gradient(135deg,#7dd3fc,#60a5fa);color:#071016}
#walkBtn{background:linear-gradient(135deg,#86efac,#4ade80);color:#07160d}
.quick small{display:block;margin-top:7px;font-size:12px;opacity:.72}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#15181d;border:1px solid var(--line);border-radius:20px;padding:15px}
.wide{grid-column:1/-1}.label{color:var(--muted);font-size:12px}.value{font-size:30px;font-weight:800;margin-top:4px}
.unit{font-size:13px;color:var(--muted)}.bar{height:8px;background:#252a31;border-radius:20px;margin-top:10px;overflow:hidden}.fill{height:100%;background:var(--blue)}.fill.g{background:var(--green)}
.monthrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.monthrow button{background:#222831;border:1px solid var(--line);color:var(--text);border-radius:12px;width:40px;height:40px;font-size:22px}.month{font-weight:700}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:10px;color:var(--muted);text-align:center;margin:9px 0 6px}
.legend{display:flex;justify-content:center;gap:18px;margin:0 0 10px;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px}.legend .ls{background:var(--blue)}.legend .lw{background:var(--green)}
.day{aspect-ratio:1;border-radius:11px;background:#1b1f25;font-size:12px;color:var(--muted);position:relative;overflow:hidden;isolation:isolate}
.day::before,.day::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.95}.day.has-walk::before{background:linear-gradient(135deg,#86efac,#4ade80);clip-path:polygon(0 0,0 100%,100% 100%)}.day.has-strength::after{background:linear-gradient(135deg,#7dd3fc,#60a5fa);clip-path:polygon(0 0,100% 0,100% 100%)}
.day-number{position:absolute;top:6px;left:7px;z-index:1}.day.has-walk .day-number,.day.has-strength .day-number{color:#071016;font-weight:800;text-shadow:0 1px 1px rgba(255,255,255,.25)}
.empty{opacity:.2}.today{outline:2px solid #f8fafc;outline-offset:2px}
@media(max-width:480px){.calendar-card{padding:14px 9px}.dow,.cal{gap:4px}.day{border-radius:9px}.day-number{top:5px;left:6px}}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}label{font-size:11px;color:var(--muted)}input{width:100%;margin-top:5px;padding:11px;background:#0e1115;border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(12px);background:#fff;color:#111;padding:11px 15px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.18s;pointer-events:none}.toast.on{opacity:1;transform:translateX(-50%)}
.note{color:var(--muted);font-size:11px;text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="app">
<h1>運動習慣</h1>
<div class="sub">ワンタッチ入力 ＋ 月次状況を常時表示</div>

<div class="quick">
<button id="strengthBtn">💪 筋トレ<small>今日の実施をON/OFF</small></button>
<button id="walkBtn">🚶 ウォーキング<small><span id="walkStepText">30</span>分追加</small></button>
</div>

<div class="grid">
<div class="card"><div class="label">筋トレ</div><div class="value"><span id="strengthDays">0</span><span class="unit"> 日</span></div><div class="label">目標 <span id="strengthGoalText">12</span>日</div><div class="bar"><div id="strengthFill" class="fill" style="width:0"></div></div></div>
<div class="card"><div class="label">ウォーキング</div><div class="value"><span id="walkTotal">0</span><span class="unit"> 分</span></div><div class="label">目標 <span id="walkGoalText">600</span>分</div><div class="bar"><div id="walkFill" class="fill g" style="width:0"></div></div></div>
<div class="card"><div class="label">運動した日</div><div class="value"><span id="activeDays">0</span><span class="unit"> 日</span></div></div>
<div class="card"><div class="label">連続記録</div><div class="value"><span id="streak">0</span><span class="unit"> 日</span></div></div>

<div class="card wide calendar-card">
<div class="monthrow"><button id="prev">‹</button><div class="month" id="monthLabel"></div><button id="next">›</button></div>
<div class="legend"><span><i class="ls"></i>筋トレ</span><span><i class="lw"></i>ウォーキング</span></div>
<div class="dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div id="calendar" class="cal"></div>
</div>

<div class="card wide">
<div style="font-weight:800">設定</div>
<div class="settings">
<label>筋トレ月目標<input id="strengthGoal" type="number" min="1" max="31" value="12"></label>
<label>歩行1タップ（分）<input id="walkStep" type="number" min="5" step="5" value="30"></label>
<label>歩行月目標（分）<input id="walkGoal" type="number" min="30" step="30" value="600"></label>
<label>メモ<input id="memo" type="text" placeholder="週3＋毎日歩く"></label>
</div>
</div>
</div>
<div class="note">HTTPSで開くと、iPhone/iPadのSafariから「ホーム画面に追加」できます。</div>
</div>
<div id="toast" class="toast"></div>
<script>
const KEY='habit_training_data_v2', SKEY='habit_training_settings_v2';
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
let viewing=new Date(); viewing=new Date(viewing.getFullYear(),viewing.getMonth(),1);

function storeGet(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function storeSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true}catch(e){return false}}
let data=storeGet(KEY,{});
let settings=Object.assign({strengthGoal:12,walkStep:30,walkGoal:600,memo:''},storeGet(SKEY,{}));

function say(t){const x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>x.classList.remove('on'),1300)}
function ensure(k){if(!data[k])data[k]={strength:0,walk:0}}
function save(){if(!storeSet(KEY,data))say('保存できませんでした')}
function today(){return new Date()}

$('strengthBtn').onclick=()=>{
 const k=dkey(today()); ensure(k); data[k].strength=data[k].strength?0:1; save();
 viewing=new Date(today().getFullYear(),today().getMonth(),1); render(); say(data[k].strength?'筋トレを記録 💪':'筋トレ記録を解除');
};
$('walkBtn').onclick=()=>{
 const k=dkey(today()); ensure(k); data[k].walk=(Number(data[k].walk)||0)+Number(settings.walkStep||30); save();
 viewing=new Date(today().getFullYear(),today().getMonth(),1); render(); say(`ウォーキング +${settings.walkStep}分`);
};
$('prev').onclick=()=>{viewing=new Date(viewing.getFullYear(),viewing.getMonth()-1,1);render()};
$('next').onclick=()=>{viewing=new Date(viewing.getFullYear(),viewing.getMonth()+1,1);render()};

function settingsChanged(){
 settings={strengthGoal:Number($('strengthGoal').value)||12,walkStep:Number($('walkStep').value)||30,walkGoal:Number($('walkGoal').value)||600,memo:$('memo').value||''};
 storeSet(SKEY,settings); render();
}
['strengthGoal','walkStep','walkGoal','memo'].forEach(id=>$(id).addEventListener('change',settingsChanged));

function streak(){
 let d=new Date(),n=0,started=false;
 for(let i=0;i<366;i++){const r=data[dkey(d)];const active=r&&((r.strength||0)>0||(r.walk||0)>0);
   if(active){n++;started=true}else if(started)break;
   d.setDate(d.getDate()-1);
 }
 return n;
}
function render(){
 $('strengthGoal').value=settings.strengthGoal;$('walkStep').value=settings.walkStep;$('walkGoal').value=settings.walkGoal;$('memo').value=settings.memo;
 $('walkStepText').textContent=settings.walkStep;$('strengthGoalText').textContent=settings.strengthGoal;$('walkGoalText').textContent=settings.walkGoal;
 const pref=mkey(viewing), rec=Object.entries(data).filter(([k])=>k.startsWith(pref));
 const sd=rec.filter(([,r])=>(r.strength||0)>0).length, wt=rec.reduce((a,[,r])=>a+(Number(r.walk)||0),0), ad=rec.filter(([,r])=>(r.strength||0)>0||(r.walk||0)>0).length;
 $('strengthDays').textContent=sd;$('walkTotal').textContent=wt;$('activeDays').textContent=ad;$('streak').textContent=streak();
 $('strengthFill').style.width=Math.min(100,sd/settings.strengthGoal*100)+'%';$('walkFill').style.width=Math.min(100,wt/settings.walkGoal*100)+'%';
 $('monthLabel').textContent=`${viewing.getFullYear()}年 ${viewing.getMonth()+1}月`;
 const c=$('calendar');c.innerHTML='';const y=viewing.getFullYear(),m=viewing.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
 for(let i=0;i<first.getDay();i++){const e=document.createElement('div');e.className='day empty';c.appendChild(e)}
 const tk=dkey(new Date());
 for(let d=1;d<=last.getDate();d++){const dt=new Date(y,m,d),k=dkey(dt),r=data[k]||{};const strength=(r.strength||0)>0,walk=(r.walk||0)>0;const e=document.createElement('div');
   e.className='day'+(strength?' has-strength':'')+(walk?' has-walk':'')+(k===tk?' today':'');
   e.innerHTML=`<span class="day-number">${d}</span>`;c.appendChild(e)}
}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
